# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"
BBPATH .= ":${LAYERDIR}/../../layers/meta-st/meta-st-stm32mp"
BBPATH .= ":${LAYERDIR}/../../layers/meta-st/meta-st-stm32mp/recipes-bsp/trusted-firmware-a"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-odyssey135d"
BBFILE_PATTERN_meta-odyssey135d = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-odyssey135d = "6"

LAYERDEPENDS_meta-odyssey135d = "core"
LAYERSERIES_COMPAT_meta-odyssey135d = "wrynose"
