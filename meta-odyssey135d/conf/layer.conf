# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-odyssey135d"
BBFILE_PATTERN_meta-odyssey135d = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-odyssey135d = "6"

LAYERDEPENDS_meta-odyssey135d = "core"
LAYERSERIES_COMPAT_meta-odyssey135d = "scarthgap"
