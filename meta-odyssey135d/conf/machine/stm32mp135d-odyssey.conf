#@TYPE: Machine
#@NAME: stm32mp1-disco
#@DESCRIPTION: [EXAMPLE] STM32MP135F-DK board ONLY with Optee boot and SDcard support
#@NEEDED_BSPLAYERS: layers/meta-openembedded/meta-oe layers/meta-openembedded/meta-python

# Define specific family common machine name
MACHINEOVERRIDES =. "stm32mp1common:stm32mp13common:"

include conf/machine/include/st-machine-common-stm32mp.inc
include conf/machine/include/st-machine-providers-stm32mp.inc

# This image follows the Buildroot five-partition layout and does not contain
# ST FWU metadata1/metadata2 partitions.  Disable the common ST fw-update
# default so TF-A does not try to load missing metadata and panic in BL2.
MACHINE_FEATURES:remove = "fw-update"
TF_A_ENABLE_METADATA = "0"

# Buildroot builds the board DTs from the bootloader/firmware/kernel source
# trees themselves.  Do not use ST's external-dt staging tree for this machine.
EXTERNAL_DT_ENABLED = "0"

PREFERRED_PROVIDER_virtual/kernel = "linux-odyssey"
PREFERRED_VERSION_linux-odyssey = "6.1%"
PREFERRED_VERSION_tf-a-stm32mp = "2.8-stm32mp-odyssey-r1"

# =========================================================================
# Chip architecture
# =========================================================================
DEFAULTTUNE = "cortexa7thf-neon-vfpv4"
include conf/machine/include/arm/armv7a/tune-cortexa7.inc

# =========================================================================
# boot scheme
# =========================================================================
BOOTSCHEME_LABELS += "optee"

# =========================================================================
# boot device
# =========================================================================
# Define the boot device supported
#BOOTDEVICE_LABELS += "emmc"
#BOOTDEVICE_LABELS += "nor-sdcard"
BOOTDEVICE_LABELS += "sdcard"

# Console
SERIAL_CONSOLES = "115200;ttySTM0"

# =========================================================================
# Machine settings
# =========================================================================
# Define the Odyssey devicetree for SD-card boot
STM32MP_DT_FILES_SDCARD = "stm32mp135d-odyssey"

# =========================================================================
# Machine features
# =========================================================================
MACHINE_FEATURES += "splashscreen"
MACHINE_FEATURES += "watchdog"
MACHINE_FEATURES += "bluetooth"
MACHINE_FEATURES += "wifi"
MACHINE_FEATURES += "nosmp"
MACHINE_FEATURES += "usbg0"

# The ST common machine defaults to kernel-image-uimage.  This board uses the
# zImage produced by linux-odyssey instead.
MACHINE_EXTRA_RRECOMMENDS:remove = "kernel-image-uimage"
MACHINE_EXTRA_RRECOMMENDS += "kernel-image"
# kernel-image is only an empty meta-package in kernel.bbclass.  Pull in the
# actual zImage and DTB packages so the single rootfs partition used by the
# Buildroot-style WIC contains both files under /boot.
ST_KERNEL_IMAGE_PACKAGE = "kernel-image-zimage"
MACHINE_EXTRA_RRECOMMENDS:remove = "kernel-image"
MACHINE_EXTRA_RRECOMMENDS += "kernel-image-zimage kernel-devicetree"

# Bluetooth
BLUETOOTH_LIST += "linux-firmware-addons-bcm43xx"
# Wifi
WIFI_LIST += "linux-firmware-addons-bcm43xx"

# =========================================================================
# Kernel
# =========================================================================

# Define the devicetree for Linux A7 examples
# No STM32MP135F-DK example DTs are used for this machine.
LINUX_A7_EXAMPLES_DT = ""

# =========================================================================
# OPTEE
# =========================================================================
# For sdk generation, declare the default board configuration to use.
ST_OPTEE_EXPORT_TA_REF_BOARD:stm32mp1common = "stm32mp135d-odyssey.dts"

# =========================================================================
# WIC for sdcard raw image
# =========================================================================
WIC_CREATE_EXTRA_ARGS = "--no-fstab-update"
WKS_FILE_DEPENDS ?= " \
    virtual/bootloader \
    virtual/trusted-firmware-a \
    e2fsprogs-native \
    ${@bb.utils.contains('BOOTSCHEME_LABELS', 'optee', 'virtual-optee-os', '', d)} \
"
# Board-specific WIC image matching the Buildroot SD-card partition order.
WKS_FILE = "sdcard-stm32mp135d-odyssey-optee.wks"
IMAGE_FSTYPES += "wic wic.bmap"
